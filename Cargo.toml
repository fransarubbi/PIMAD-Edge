[package]
name = "pimad_edge"
version = "0.28.1"
edition = "2024"

[dependencies]
# Async Runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal"] }

# Consultas http
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# MQTT
rumqttc = "0.25.1"

# Serialización
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
toml = "0.8"

# Utilidades
which = "6.0"
thiserror = "1.0"
chrono = "0.4"
rand = "0.8"
sysinfo = "0.33" # Ajustado a versión compatible común
rustls = { version = "0.23", features = ["ring"] }

# Base de Datos
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }

# gRPC (Protobuf)
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport", "gzip"] }
prost = "0.13"
tokio-stream = "0.1.17"
fastrand = "2.3.0"
tokio-util = "0.7.17"
futures = "0.3.32"

# OTA
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-tar", "compression-tar-gz", "github", "reqwest"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
